# This is a basic workflow to help you get started with Actions

name: Deploy React App COMP3104 DevOps Project CI
run-name: ${{ github.actor }} is testing out GitHub Actions

# Controls when the workflow will run
on:
  push:
    branches: ["main"]
    # Triggers the workflow on pull request events but only for the "main" branch
  pull_request:
    branches: ["main"]
     # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    # A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
      # The type of runner that the job will run on
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week5lab


 # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        
# Step 2: Set up the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Specify your required Node version
          cache: 'npm'         # Automatically caches npm dependencies
          cache-dependency-path: week5lab/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
      

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./week5lab/build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com" 